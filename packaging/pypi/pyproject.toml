[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "xacli"
dynamic = ["version"]
description = "xa — a fast, native Rust coding-agent CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jinfagang19" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
]

[project.urls]
Homepage = "https://github.com/jinfagang/xa"
Repository = "https://github.com/jinfagang/xa"
