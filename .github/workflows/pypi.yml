name: Publish xacli to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ARM64 is cross-compiled using cross; all other entries build
          # natively on their matching hosted runner.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            wheel_plat: manylinux_2_17_x86_64
            cross: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            wheel_plat: manylinux_2_17_aarch64
            cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            wheel_plat: macosx_10_13_x86_64
            cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            wheel_plat: macosx_11_0_arm64
            cross: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            wheel_plat: win_amd64
            cross: false
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            wheel_plat: win_arm64
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release tag matches Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install wheel builder
        run: python -m pip install --upgrade build
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Configure Windows ARM64 linker
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=rust-lld" >> "$GITHUB_ENV"
      - name: Build xa
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
      - name: Build xacli wheel
        shell: bash
        env:
          XA_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/xa${{ runner.os == 'Windows' && '.exe' || '' }}
          XA_WHEEL_PLAT: ${{ matrix.wheel_plat }}
        run: python -m build --wheel packaging/pypi --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
